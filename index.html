<!doctype html>
<html lang="en">
<head>
<title>Tic Tac Toe</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    color-scheme: light dark;
    --paper: #f8f3ea;
    --ink: #202522;
    --muted: #6d716c;
    --line: #d9d0c2;
    --surface: rgba(255, 253, 249, 0.86);
    --coral: #e4604d;
    --teal: #187c78;
    --shadow: 0 24px 60px rgba(56, 45, 31, 0.16);
  }
  * {
    box-sizing: border-box;
  }
  body {
    min-height: 100vh;
    margin: 0;
    padding: 2rem 1rem;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(#d8cbbb 0.7px, transparent 0.7px);
    background-size: 18px 18px;
    font-family: "Trebuchet MS", sans-serif;
  }
  main {
    width: min(100%, 30rem);
    margin: 0 auto;
    padding: clamp(1.5rem, 6vw, 3rem);
    text-align: center;
    background: var(--surface);
    border: 1px solid rgba(217, 208, 194, 0.8);
    border-radius: 1.25rem;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  .eyebrow {
    margin: 0 0 0.5rem;
    color: var(--coral);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(2.2rem, 10vw, 3.5rem);
    line-height: 1;
  }
  .subtitle {
    margin: 0.75rem 0 1.75rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  #turn-status,
  h2 {
    min-height: 1.7em;
    margin: 0 0 1rem;
    font-size: 1rem;
    font-weight: 700;
  }
  #turn-status {
    color: var(--teal);
  }
  table {
    width: min(100%, 21rem);
    margin: 0 auto 1.5rem;
    border-collapse: separate;
    border-spacing: 0.55rem;
  }
  td {
    width: 33.333%;
    height: clamp(5rem, 22vw, 6.25rem);
    padding: 0;
    text-align: center;
    background: rgba(255, 255, 255, 0.64);
    border: 1px solid var(--line);
    border-radius: 0.7rem;
    box-shadow: 0 4px 0 rgba(217, 208, 194, 0.6);
    font-size: clamp(2rem, 10vw, 3rem);
    line-height: 1;
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  td:has(input:hover),
  td:has(input:focus-visible) {
    border-color: var(--teal);
    box-shadow: 0 6px 0 var(--teal);
    transform: translateY(-2px);
  }
  input {
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    opacity: 0;
  }
  button {
    padding: 0.8rem 1.2rem;
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 160ms ease, transform 160ms ease;
  }
  button:hover,
  button:focus-visible {
    background: var(--teal);
    transform: translateY(-2px);
  }
  button:focus-visible,
  input:focus-visible {
    outline: 3px solid var(--coral);
    outline-offset: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #202522;
      --ink: #f8f3ea;
      --muted: #b4b6ae;
      --line: #4d514b;
      --surface: rgba(39, 44, 40, 0.9);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }
    body {
      background-image: radial-gradient(#49504a 0.7px, transparent 0.7px);
    }
    td {
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.24);
    }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">A tiny battle of wits</p>
  <h1>Tic Tac Toe</h1>
  <p class="subtitle">You are the human. Outsmart the robot.</p>
  <p id="turn-status" role="status" aria-live="polite">Your move</p>

<table>
  <caption hidden>Choose an empty square to make your move</caption>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
  <tr>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
    <td><input type="checkbox" /></td>
  </tr>
</table>

<h2 hidden>Game over</h2>
<button id="play-again" hidden>Play again</button>
</main>

<script>
  // Initialization
  const boxes = Array.from(document.querySelectorAll("td"));
  const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));
  const rows = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`tr:nth-child(${n}) td`))
  );
  const columns = [1, 2, 3].map((n) =>
    Array.from(document.querySelectorAll(`td:nth-child(${n})`))
  );
  const diagonals = [
    [
      [1, 1],
      [2, 2],
      [3, 3],
    ],
    [
      [3, 1],
      [2, 2],
      [1, 3],
    ],
  ].map((set) =>
    set.map(([x, y]) =>
      document.querySelector(`tr:nth-child(${x}) td:nth-child(${y})`)
    )
  );
  const gameOver = document.querySelector("h2");
  const turnStatus = document.getElementById("turn-status");
  const playAgainBtn = document.getElementById("play-again");
  const HUMAN = "🧑‍💻";
  const ROBOT = "🤖";

  // Decide who goes first
  if (Math.random() > 0.5) {
    turnStatus.textContent = "The robot is thinking...";
    runRobotTurn();
    turnStatus.textContent = "Your move";
  }

  // Handle when a user clicks an input
  for (const input of inputs) {
    input.addEventListener("click", handleClickInput);
  }

  // Play again: reload the page to reset state
  playAgainBtn.addEventListener("click", () => window.location.reload());

  // The user chose a box, check for win, robot turn, check for win
  function handleClickInput(evt) {
    evt.target.closest("td").innerHTML = HUMAN;
    if (hasWin()) {
      return endGame("human");
    }
    if (hasDraw()) {
      return endGame("draw");
    }
    turnStatus.textContent = "The robot is thinking...";
    runRobotTurn();
    if (hasWin()) {
      return endGame("robot");
    }
    if (hasDraw()) {
      return endGame("draw");
    }
    turnStatus.textContent = "Your move";
  }

  // Choose a random available box
  function runRobotTurn() {
    const robotBoxes = shuffle(boxes);
    while (robotBoxes.length) {
      const box = robotBoxes.shift();
      if (box.querySelector("input")) {
        box.innerHTML = ROBOT;
        break;
      }
    }
  }

  // Determine win
  function hasWin() {
    return (
      rows.some(hasAllSame) ||
      columns.some(hasAllSame) ||
      diagonals.some(hasAllSame)
    );
  }

  // Determine draw (no more available inputs)
  function hasDraw() {
    return !document.querySelector("td input[type=checkbox]");
  }

  // Determine if every cell matches
  function hasAllSame(arr) {
    return arr.every(
      (td) => !td.querySelector("input") && td.innerHTML === arr[0].innerHTML
    );
  }

  // Display game over, cancel events
  function endGame(result) {
    if (result === "draw") {
      gameOver.textContent = "Game over: Draw";
    } else if (result === "human") {
      gameOver.textContent = "Game over: You win";
    } else if (result === "robot") {
      gameOver.textContent = "Game over: Robot wins";
    }
    gameOver.hidden = false;
    turnStatus.textContent = "Round complete";
    playAgainBtn.hidden = false;
    // Move focus to the button for quick replay
    playAgainBtn.focus();
    for (const input of inputs) {
      input.removeEventListener("click", handleClickInput);
      input.remove();
    }
  }

  // Shuffle a copy of the input array
  function shuffle(array) {
    array = array.slice(0);
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * i);
      const temp = array[i];
      array[i] = array[j];
      array[j] = temp;
    }
    return array;
  }
</script>
